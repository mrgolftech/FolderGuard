name: Publish FolderGuard v0.0.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.0.2.yml'
  workflow_dispatch:

concurrency:
  group: folderguard-release-v0.0.2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gui:
    name: Build and validate GUI ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows GUI
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.platform }}
      - name: Compile Release
        run: cmake --build build --config Release --parallel
      - name: Assert binary version v0.0.2
        shell: pwsh
        run: |
          $binary = Get-Item 'build/Release/FolderGuard.exe'
          $version = $binary.VersionInfo.FileVersion
          if ($version -notin @('0.0.2','0.0.2.0')) {
            throw "Expected version 0.0.2, got FileVersion=$version"
          }
          Write-Host "Validated FolderGuard GUI FileVersion=$version"
      - name: Test actual NTFS ACL and attributes
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test four GUI switches on disposable NTFS directory
        timeout-minutes: 5
        shell: pwsh
        run: ./tests/GuiInteraction.ps1
      - name: Package portable GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'release/gui'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'build/Release/FolderGuard.exe' "$stage/FolderGuard.exe"
          Copy-Item 'README-GUI.md' "$stage/README.md"
          Copy-Item 'tests/MACHINE_VALIDATION.md' "$stage/MACHINE_VALIDATION.md"
          $name = 'FolderGuard-v0.0.2-GUI-${{ matrix.platform }}.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath "release/$name" -CompressionLevel Optimal -Force
          if ((Get-Item "release/$name").Length -lt 10000) { throw "Invalid GUI archive: $name" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-GUI-${{ matrix.platform }}
          path: release/FolderGuard-v0.0.2-GUI-${{ matrix.platform }}.zip
          if-no-files-found: error

  cli:
    name: Validate and package CLI PowerShell
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell 5.1 script syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Windows PowerShell 5.x required for syntax check" }
          $tokens = $null
          $issues = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'FolderGuard.ps1'), [ref]$tokens, [ref]$issues
          ) | Out-Null
          if ($issues -and $issues.Count -gt 0) {
            $issues | ForEach-Object { Write-Host $_ }
            throw "FolderGuard.ps1 contains PowerShell parsing errors"
          }
          if (!(Test-Path 'Start-FolderGuard.cmd')) { throw 'CLI launcher missing' }
          Write-Host "PowerShell CLI syntax OK; Windows PowerShell $($PSVersionTable.PSVersion)"
      - name: Package script-based command line edition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'release/cli'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'FolderGuard.ps1' "$stage/FolderGuard.ps1"
          Copy-Item 'Start-FolderGuard.cmd' "$stage/Start-FolderGuard.cmd"
          Copy-Item 'README-CLI.md' "$stage/README.md"
          Copy-Item 'docs/USAGE.md' "$stage/USAGE.md"
          $name = 'FolderGuard-v0.0.2-CLI-PowerShell.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath "release/$name" -CompressionLevel Optimal -Force
          if ((Get-Item "release/$name").Length -lt 2000) { throw "Invalid CLI archive: $name" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-CLI-PowerShell
          path: release/FolderGuard-v0.0.2-CLI-PowerShell.zip
          if-no-files-found: error

  publish:
    name: Create tagged GitHub Release
    needs: [gui, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          merge-multiple: true
          path: dist
      - name: Verify all variants and create SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -s FolderGuard-v0.0.2-GUI-Win32.zip
          test -s FolderGuard-v0.0.2-GUI-x64.zip
          test -s FolderGuard-v0.0.2-CLI-PowerShell.zip
          sha256sum FolderGuard-v0.0.2-{GUI-Win32,GUI-x64,CLI-PowerShell}.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish v0.0.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.0.2 already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create v0.0.2 \
            dist/FolderGuard-v0.0.2-GUI-Win32.zip \
            dist/FolderGuard-v0.0.2-GUI-x64.zip \
            dist/FolderGuard-v0.0.2-CLI-PowerShell.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FolderGuard v0.0.2" \
            --notes-file RELEASE_NOTES-v0.0.2.md \
            --latest
