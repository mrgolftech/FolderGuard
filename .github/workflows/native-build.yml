name: Native Win7/Win10 Builds
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC 2022)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.platform }}
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Run NTFS security smoke tests
        run: ctest --test-dir build -C Release --verbose
      - name: Exercise GUI controls on disposable directory
        if: matrix.platform == 'x64'
        timeout-minutes: 3
        shell: pwsh
        run: ./tests/GuiInteraction.ps1
      - name: Capture real GUI screenshot (best effort)
        if: always() && matrix.platform == 'x64'
        shell: pwsh
        run: ./tests/CaptureGui.ps1
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'x64'
        with:
          name: FolderGuard-v3-GUI-Screenshots
          path: artifacts/
          if-no-files-found: warn
      - name: Check EXE and report size
        shell: pwsh
        run: |
          $exe = 'build/Release/FolderGuard.exe'
          if (!(Test-Path $exe)) { throw 'Build failed: EXE missing' }
          $size = (Get-Item $exe).Length
          Write-Host "${{ matrix.platform }}: $size bytes ($([math]::Round($size/1MB, 2)) MiB)"
      - uses: actions/upload-artifact@v4
        with:
          name: FolderGuard-v3-${{ matrix.platform }}
          path: build/Release/FolderGuard.exe
          if-no-files-found: error
